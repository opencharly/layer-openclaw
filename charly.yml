#  opencharly/layer-openclaw — the OpenClaw family (a `layer-<family>` repo).
#
#  ONE repo owns the family: the gateway image (box/openclaw), the gateway layer
#  candy (candy/openclaw, this repo's successor to opencharly/pod-openclaw) and
#  the disposable R10 bed that proves them (check-openclaw-pod, inline below).
#  The `openclaw:` CHECK VERB is a separate concern and stays in its own repo,
#  opencharly/plugin-openclaw; the image composes that plugin candy so this
#  repo's bed can author `openclaw:` steps.
#
#  The repo NAME carries the class: a product family is a layer-class repo
#  (`layer-<family>`, the `layer-agentteams` precedent), never a bare name.
#
#  The `cachyos` namespace is imported for the box's base and builder, exactly as
#  distro-cachyos reaches `arch` — one-directional, and the import is what makes
#  this repo validate and build on its own (a family repo cannot skip it).
repo: github.com/opencharly/layer-openclaw
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    # The base is CachyOS, so the builders come from the arch stack INSIDE the
    # cachyos namespace — the nested form is the one that resolves.
    builder:
        npm: cachyos.arch.arch-builder
        pixi: cachyos.arch.arch-builder
import:
    # The CachyOS base. The floor is the tag that dropped the retired openclaw pins
    # from the CachyOS refs list (distro-cachyos v2026.281.1001): those pins kept
    # pod-openclaw's `openclaw` candy inside this project's closure, and a remote candy
    # of that name shadows this repo's local one — the resolver fails closed with
    # `local candy "openclaw" shadows remote candy "github.com/opencharly/pod-openclaw"`.
    # An earlier tag reproduces that error; the floor is measured both ways.
    #
    # It is NOT the ceiling. v2026.281.1001's `box/crabbox-e2e` still pins
    # `pod-crabbox:v2026.274.0652`, a tag that no longer exists in that repo, so
    # resolving this project's closure at that tag fails. That is what broke the
    # marketplace corpus regeneration org-wide (opencharly/marketplace#613: every
    # generate and the daily refresh died on that ref, 2026-11-10..14): the corpus
    # pins this repo, this repo pinned that base. v2026.318.1213's `box/crabbox-e2e`
    # composes `pod-crabbox-coordinator:v2026.293.1003` instead — the fix that landed
    # in distro-cachyos 2026.293.1743 — so the closure resolves.
    - cachyos: '@github.com/opencharly/distro-cachyos:v2026.324.2235'
discover:
    - path: candy
      recursive: true
    - path: box
      recursive: true
# check-openclaw-pod — the family's R10 witness. It builds the gateway image on
# the real CachyOS base and deploys it as a disposable pod, then runs the
# composed candies' baked checks (the npm binary, the pinned package version,
# the engine floor, the supervised service, the published port and /healthz)
# plus the plugin's own verb steps below.
check-openclaw-pod:
    pod:
        image: openclaw
        disposable: true
        lifecycle: dev
        # The `openclaw:` verb is served OUT-OF-PROCESS over go-plugin, and charly's loader
        # perf-scopes plugins to what the resolved work references — a declared-but-unreferenced
        # candy is never loaded ("declares verb:openclaw, but it was not loaded"). The loader's own
        # diagnostic names the remedy: "add the candy to the bed's add_candy: so the check runner
        # passes it as an extra candy ref". Without it the four `openclaw:` steps below fail with
        # "no go-plugin broker (plugin not served over go-plugin)".
        # Compiling the plugin into the charly binary instead does NOT work: an in-process plugin
        # serves no broker, which trades this failure for that one (opencharly/charly#869, withdrawn).
        add_candy:
            # Same tag the box composes: the bed's ref and box/openclaw's ref describe ONE
            # candy in one `box=openclaw` scope, so holding this one a tag behind made the
            # resolver report "resolved to multiple git tags with differing content" on
            # every run. Keep the two refs equal.
            - '@github.com/opencharly/plugin-openclaw/candy/plugin-openclaw:v2026.293.0358'
        description: Sole build+runtime witness for the OpenClaw family — builds the gateway image on the CachyOS (Arch) base (the npm install of the pinned package, the nodejs/socat/supervisord stack) and deploys it as a disposable pod. Runs the inherited gateway checks — the binary under ~/.npm-global/bin, the pinned version, the engine range, the supervised service, the :18789 TCP reachability and /healthz — plus the plugin-openclaw verb's own live dispatch (health, ready and the in-venue model status against the running gateway).
        plan:
            - check: the openclaw verb reaches the gateway's /healthz liveness endpoint on the running gateway
              id: openclaw-verb-health
              openclaw:
                method: health
              stdout:
                - contains: "ok"
              eventually: 90s
              retry_interval: 5s
              context:
                - runtime
            - check: the openclaw verb reports the gateway ready via /readyz
              id: openclaw-verb-ready
              openclaw:
                method: ready
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
            - check: the openclaw verb reports the gateway's model status via the in-venue CLI
              id: openclaw-verb-models
              openclaw:
                method: models
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
openclaw-deploy-skill:
  skill:
    name: openclaw-deploy
    family: automation
    owner: openclaw
    triggers:
      - "OpenClaw gateway / the OpenClaw family's candies / model auth / browser integration / channel setup"
