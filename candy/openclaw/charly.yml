openclaw:
    candy:
        description: |
            Headless OpenClaw AI gateway service on port 18789 (OpenClaw 2.0,
            npm openclaw@2026.9.8 — the current latest stable). Installs the openclaw npm package globally
            (package.json -> npm install -g) so the gateway binary lands at
            ~/.npm-global/bin/openclaw, then runs it as the supervised
            `openclaw` service (`openclaw gateway --port 18789
            --allow-unconfigured --bind loopback` — loopback bind needs no
            auth and matches the socat relay; unconfigured lets the headless
            gateway start before any operator setup). socat
            relays the loopback-bound gateway onto the container interface
            and a `data` volume persists ~/.openclaw. Binary presence, the
            supervised service, the reachable port, and the gateway's own
            /healthz liveness endpoint are all verifiable.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.272.0322'
            - '@github.com/opencharly/layer-socat:v2026.272.0422'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        env:
            NODE_ENV: "production"
        port:
            - 18789
        port_relay:
            - 18789
        volume:
            - name: data
              path: "~/.openclaw"
        alias:
            - name: openclaw
              command: openclaw
        service:
            - name: openclaw
              exec: "%(ENV_HOME)s/.npm-global/bin/openclaw gateway --port 18789 --allow-unconfigured --bind loopback"
              restart: always
              enable: true
              scope: system
        plan:
            - check: the openclaw gateway binary is installed into the npm global bin
              file:
                file: ${HOME}/.npm-global/bin/openclaw
                exists: true
            - check: the openclaw gateway reports the exact pinned package version
              exit_status: 0
              stdout:
                - matches: "2026\\.9\\.8"
              command: ${HOME}/.npm-global/bin/openclaw --version
            - check: the in-image Node satisfies openclaw 2026.9.8's engine range (>=24.16.0 <25 OR >=26.1.0; the floor moved at 2026.9.3 and excludes node 22 and 25.x)
              exit_status: 0
              stdout:
                - matches: "v(24\\.(1[6-9]|[2-9][0-9])\\.|26\\.([1-9][0-9]*)\\.|2[7-9]\\.|[3-9][0-9]*\\.|[1-9][0-9]{2,}\\.)"
              command: node --version
            - check: the running gateway's /healthz liveness endpoint responds 200 (OpenClaw 2.0 container probe)
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:18789}/healthz
                status: 200
            - check: the openclaw gateway runs as a supervised service
              context:
                - runtime
              service:
                service: openclaw
                running: true
            - check: the running gateway accepts a TCP connection on its published port 18789
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:18789}
                reachable: true

openclaw-layer-skill:
    skill:
        name: openclaw-layer
        family: openclaw
        owner: openclaw
