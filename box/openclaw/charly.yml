openclaw:
    candy:
        # The OpenClaw family's image. It composes exactly two candies: the gateway
        # layer this repo owns, and the out-of-process `openclaw:` check verb
        # (composed so this repo's own bed can author `openclaw:` steps — the
        # plugin is not compiled into charly). No desktop, no browser, no tool
        # bundle; a consumer that wants those composes the candies it needs.
        enabled: true
        base: cachyos.cachyos
        candy:
            - openclaw
            - '@github.com/opencharly/plugin-openclaw/candy/plugin-openclaw:v2026.293.0358'

openclaw-skill:
    skill:
        name: openclaw
        family: openclaw
        owner: openclaw
        category: images
        triggers:
            - "the headless OpenClaw gateway image / the `openclaw` box on the CachyOS base"
            - "deploying OpenClaw with no desktop or browser"
            - "the `check-openclaw-pod` bed / probing a running gateway from a plan"
